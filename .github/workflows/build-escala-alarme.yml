name: Build Escala Alarme

on:
  push:
    branches:
      - chatgpt/escala-alarme-build-20260822
    paths:
      - 'Escala_Alarme.cherri'
      - '.github/workflows/build-escala-alarme.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'Escala_Alarme.cherri'
      - '.github/workflows/build-escala-alarme.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - name: Fetch iCloud donor Shortcut
        run: |
          python3 - <<'PY'
          import json, plistlib
          from pathlib import Path
          from urllib.request import Request, urlopen

          shortcut_id = 'be9afb3352b34715a160b13acf814c96'
          api = f'https://www.icloud.com/shortcuts/api/records/{shortcut_id}'
          req = Request(api, headers={'User-Agent': 'Mozilla/5.0'})
          with urlopen(req, timeout=45) as r:
              record = json.loads(r.read())
          Path('donor_record.json').write_text(json.dumps(record, indent=2, ensure_ascii=False))

          urls = []
          def walk(value, path='root'):
              if isinstance(value, dict):
                  for k, v in value.items():
                      p = f'{path}.{k}'
                      if k == 'downloadURL' and isinstance(v, str):
                          urls.append((p, v))
                      walk(v, p)
              elif isinstance(value, list):
                  for i, v in enumerate(value):
                      walk(v, f'{path}[{i}]')
          walk(record)
          print('Download URLs found:', len(urls))
          if not urls:
              raise SystemExit('No downloadURL found in iCloud record')

          parsed = None
          summary = []
          for i, (source_path, url) in enumerate(urls):
              req = Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              with urlopen(req, timeout=45) as r:
                  data = r.read()
              out = Path(f'donor_candidate_{i}.bin')
              out.write_bytes(data)
              magic = data[:8]
              print(i, source_path, len(data), magic)
              summary.append(f'candidate {i}: {source_path} size={len(data)} magic={magic!r}')
              try:
                  obj = plistlib.loads(data)
              except Exception as e:
                  summary.append(f'candidate {i}: plist parse failed: {e}')
                  continue
              if isinstance(obj, dict) and 'WFWorkflowActions' in obj:
                  parsed = obj
                  Path('donor_unsigned.shortcut').write_bytes(data)
                  Path('donor.plist').write_bytes(plistlib.dumps(obj, fmt=plistlib.FMT_XML, sort_keys=False))
                  summary.append(f'candidate {i}: parsed workflow with {len(obj["WFWorkflowActions"])} actions')
                  break

          if parsed is None:
              Path('donor_summary.txt').write_text('\n'.join(summary))
              raise SystemExit('Could not parse any donor candidate as an unsigned Shortcut plist')

          lines = []
          for idx, action in enumerate(parsed['WFWorkflowActions']):
              ident = action.get('WFWorkflowActionIdentifier', '')
              params = action.get('WFWorkflowActionParameters', {})
              lines.append(f'[{idx}] {ident}')
              lines.append(json.dumps(params, ensure_ascii=False, indent=2, default=str))
          Path('donor_actions.txt').write_text('\n'.join(lines))
          Path('donor_summary.txt').write_text('\n'.join(summary))
          print('Donor extraction OK')
          PY

      - name: Checkout Cherri v2.3.0
        uses: actions/checkout@v6
        with:
          repository: electrikmilk/cherri
          ref: v2.3.0
          path: cherri

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24.x'
          cache-dependency-path: cherri/go.sum

      - name: Add HubSign request headers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('cherri/signing.go')
          s = p.read_text()
          needle = 'request.Header.Set("User-Agent", fmt.Sprintf("cherri/%s", version))'
          replacement = needle + '\n\trequest.Header.Set("Origin", "https://routinehub.co")\n\trequest.Header.Set("Referer", "https://routinehub.co/")'
          if needle not in s:
              raise SystemExit('HubSign header insertion point not found')
          p.write_text(s.replace(needle, replacement, 1))
          PY

      - name: Compile compact base Shortcut
        run: |
          set +e
          cd cherri
          go run . ../Escala_Alarme.cherri --debug
          STATUS=$?
          cd ..
          set -e
          echo "Cherri exit status: $STATUS"
          test -f "Escala Alarme.plist"

      - name: Patch current iOS Clock and Sleep Focus actions
        run: |
          python3 - <<'PY'
          import plistlib, uuid
          from pathlib import Path

          path = Path('Escala Alarme.plist')
          shortcut = plistlib.loads(path.read_bytes())
          actions = shortcut['WFWorkflowActions']

          CLOCK_DESC_FIND = {
              'TeamIdentifier': '0000000000',
              'BundleIdentifier': 'com.apple.mobiletimer',
              'Name': 'Clock',
              'AppIntentIdentifier': 'AlarmEntity',
              'ActionRequiresAppInstallation': True,
          }
          CLOCK_DESC_TOGGLE = {
              'TeamIdentifier': '0000000000',
              'BundleIdentifier': 'com.apple.mobiletimer',
              'Name': 'Clock',
              'AppIntentIdentifier': 'ToggleAlarmIntent',
          }

          def U():
              return str(uuid.uuid4()).upper()

          def alarm_block(label, state, tag):
              find_id = U()
              group_id = U()
              output_name = f'{tag} Find Alarm'
              find_action = {
                  'WFWorkflowActionIdentifier': 'com.apple.mobiletimer-framework.MobileTimerIntents.MTGetAlarmsIntent',
                  'WFWorkflowActionParameters': {
                      'UUID': find_id,
                      'CustomOutputName': output_name,
                      'WFContentItemFilter': {
                          'Value': {
                              'WFActionParameterFilterTemplates': [{
                                  'Operator': 4,
                                  'Values': {'Unit': 4, 'String': label},
                                  'Removable': True,
                                  'Property': 'label',
                              }],
                              'WFActionParameterFilterPrefix': 1,
                              'WFContentPredicateBoundedDate': False,
                          },
                          'WFSerializationType': 'WFContentPredicateTableTemplate',
                      },
                      'AppIntentDescriptor': CLOCK_DESC_FIND.copy(),
                  },
              }
              repeat_start = {
                  'WFWorkflowActionIdentifier': 'is.workflow.actions.repeat.each',
                  'WFWorkflowActionParameters': {
                      'GroupingIdentifier': group_id,
                      'WFControlFlowMode': 0,
                      'WFInput': {
                          'Value': {
                              'Type': 'ActionOutput',
                              'OutputUUID': find_id,
                              'OutputName': output_name,
                          },
                          'WFSerializationType': 'WFTextTokenAttachment',
                      },
                  },
              }
              toggle = {
                  'WFWorkflowActionIdentifier': 'com.apple.mobiletimer-framework.MobileTimerIntents.MTToggleAlarmIntent',
                  'WFWorkflowActionParameters': {
                      'UUID': U(),
                      'alarm': {
                          'Value': {'VariableName': 'Repeat Item', 'Type': 'Variable'},
                          'WFSerializationType': 'WFTextTokenAttachment',
                      },
                      'AppIntentDescriptor': CLOCK_DESC_TOGGLE.copy(),
                      'ShowWhenRun': False,
                      'state': state,
                  },
              }
              repeat_end = {
                  'WFWorkflowActionIdentifier': 'is.workflow.actions.repeat.each',
                  'WFWorkflowActionParameters': {
                      'GroupingIdentifier': group_id,
                      'WFControlFlowMode': 2,
                      'UUID': U(),
                  },
              }
              return [find_action, repeat_start, toggle, repeat_end]

          replacements = {
              'PATCH_DESLIGAR_0700': alarm_block('Escala 07:00', 0, '0700 OFF'),
              'PATCH_DESLIGAR_0745': alarm_block('Escala 07:45', 0, '0745 OFF'),
              'PATCH_LIGAR_0700': alarm_block('Escala 07:00', 1, '0700 ON'),
              'PATCH_LIGAR_0745': alarm_block('Escala 07:45', 1, '0745 ON'),
              'PATCH_ATIVAR_SLEEP': [{
                  'WFWorkflowActionIdentifier': 'is.workflow.actions.dnd.set',
                  'WFWorkflowActionParameters': {
                      'Enabled': 1,
                      'FocusModes': {
                          'Identifier': 'com.apple.sleep.sleep-mode',
                          'DisplayString': 'Sleep',
                      },
                  },
              }],
          }

          patched = []
          seen = set()
          for action in actions:
              if action.get('WFWorkflowActionIdentifier') == 'is.workflow.actions.comment':
                  marker = action.get('WFWorkflowActionParameters', {}).get('WFCommentActionText')
                  if marker in replacements:
                      patched.extend(replacements[marker])
                      seen.add(marker)
                      continue
              patched.append(action)

          missing = set(replacements) - seen
          if missing:
              raise SystemExit(f'Missing patch markers: {sorted(missing)}')

          shortcut['WFWorkflowActions'] = patched
          path.write_bytes(plistlib.dumps(shortcut, fmt=plistlib.FMT_XML, sort_keys=False))
          Path('Escala Alarme_unsigned.shortcut').write_bytes(plistlib.dumps(shortcut, fmt=plistlib.FMT_BINARY, sort_keys=False))
          Path('Escala Alarme.shortcut').unlink(missing_ok=True)
          print(f'Patched workflow actions: {len(actions)} -> {len(patched)}')
          PY

      - name: Structural validation
        run: |
          python3 - <<'PY'
          import plistlib
          from collections import Counter
          from pathlib import Path

          sc = plistlib.loads(Path('Escala Alarme.plist').read_bytes())
          actions = sc['WFWorkflowActions']
          ids = [a.get('WFWorkflowActionIdentifier', '') for a in actions]
          counts = Counter(ids)
          print('Action count:', len(actions))
          print('Condition blocks:', counts['is.workflow.actions.conditional'])
          print('Nothing helpers:', counts['is.workflow.actions.nothing'])
          if len(actions) > 180:
              raise SystemExit('Shortcut unexpectedly large')

          comments = [a.get('WFWorkflowActionParameters', {}).get('WFCommentActionText', '') for a in actions]
          if any(x.startswith('PATCH_') for x in comments):
              raise SystemExit('Patch marker left in Shortcut')

          finds = [a for a in actions if a.get('WFWorkflowActionIdentifier','').endswith('MTGetAlarmsIntent')]
          toggles = [a for a in actions if a.get('WFWorkflowActionIdentifier','').endswith('MTToggleAlarmIntent')]
          focuses = [a for a in actions if a.get('WFWorkflowActionIdentifier') == 'is.workflow.actions.dnd.set']
          print('Find Alarms:', len(finds), 'Toggle Alarms:', len(toggles), 'Sleep Focus:', len(focuses))
          if len(finds) != 4 or len(toggles) != 4 or len(focuses) != 1:
              raise SystemExit('Unexpected Clock/Focus action count')

          labels = []
          for a in finds:
              p = a['WFWorkflowActionParameters']
              d = p['AppIntentDescriptor']
              assert d['BundleIdentifier'] == 'com.apple.mobiletimer'
              row = p['WFContentItemFilter']['Value']['WFActionParameterFilterTemplates'][0]
              labels.append(row['Values']['String'])
          if set(labels) != {'Escala 07:00', 'Escala 07:45'}:
              raise SystemExit(f'Unexpected alarm labels: {labels}')

          states = []
          for a in toggles:
              p = a['WFWorkflowActionParameters']
              assert p['AppIntentDescriptor']['BundleIdentifier'] == 'com.apple.mobiletimer'
              states.append(p['state'])
          if states.count(0) != 2 or states.count(1) != 2:
              raise SystemExit(f'Unexpected toggle states: {states}')

          fp = focuses[0]['WFWorkflowActionParameters']
          assert fp.get('Enabled') == 1
          assert fp['FocusModes']['Identifier'] == 'com.apple.sleep.sleep-mode'

          serialized = repr(sc).lower()
          if 'com.apple.clock' in serialized:
              raise SystemExit('Legacy com.apple.clock descriptor remains')
          for forbidden in ['corpus christi', 'independência do brasil', 'tiradentes', 'consciência negra']:
              if forbidden in serialized:
                  raise SystemExit(f'Hard-coded holiday leaked into compact version: {forbidden}')
          print('Structural validation OK')
          PY

      - name: Sign patched Shortcut with HubSign
        run: |
          python3 - <<'PY'
          import json, plistlib
          from pathlib import Path
          from urllib.request import Request, urlopen

          shortcut = plistlib.loads(Path('Escala Alarme.plist').read_bytes())
          xml = plistlib.dumps(shortcut, fmt=plistlib.FMT_XML).decode('utf-8')
          payload = json.dumps({'shortcutName': 'Escala Alarme', 'shortcut': xml}).encode('utf-8')
          req = Request(
              'https://hubsign.routinehub.services/sign',
              data=payload,
              headers={
                  'Content-Type': 'application/json',
                  'User-Agent': 'cherri/2.3.0',
                  'Origin': 'https://routinehub.co',
                  'Referer': 'https://routinehub.co/',
              },
              method='POST',
          )
          with urlopen(req, timeout=45) as response:
              signed = response.read()
          if signed[:4] != b'AEA1':
              raise SystemExit(f'Invalid signed response magic: {signed[:16]!r}')
          Path('Escala Alarme.shortcut').write_bytes(signed)
          print(f'Signed Shortcut: {len(signed)} bytes, AEA1 OK')
          PY

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: escala-alarme-compact
          if-no-files-found: error
          path: |
            Escala Alarme.shortcut
            Escala Alarme_unsigned.shortcut
            Escala Alarme.plist
            Escala_Alarme_processed.cherri
            Escala_Alarme.cherri
            donor_record.json
            donor_candidate_*.bin
            donor_unsigned.shortcut
            donor.plist
            donor_actions.txt
            donor_summary.txt
