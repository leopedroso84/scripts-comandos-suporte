name: Build Escala Alarme

on:
  pull_request:
    branches:
      - main
    paths:
      - 'Escala_Alarme.cherri'
      - '.github/workflows/build-escala-alarme.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - name: Harvest current iOS donor actions
        run: |
          python3 - <<'PY'
          import json, plistlib, urllib.request
          from pathlib import Path

          donors = {
              'alarms': '430344710df4418fb9ab444e35a31aac',
              'focus': '30e48072efab4f89a8c58b7042eedcc2',
          }

          def get(url):
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.read()

          out = {}
          for kind, sid in donors.items():
              record = json.loads(get(f'https://www.icloud.com/shortcuts/api/records/{sid}'))
              template = record['fields']['shortcut']['value']['downloadURL']
              url = template.replace('${f}', 'shortcut.plist')
              data = get(url)
              Path(f'donor_{kind}.shortcut').write_bytes(data)
              try:
                  plist = plistlib.loads(data)
              except Exception as exc:
                  raise SystemExit(f'Could not parse {kind} donor plist: {exc}')

              actions = plist.get('WFWorkflowActions', [])
              selected = []
              for i, a in enumerate(actions):
                  ident = a.get('WFWorkflowActionIdentifier', '')
                  params = a.get('WFWorkflowActionParameters', {})
                  text = json.dumps({'id': ident, 'params': params}, default=str).lower()
                  if kind == 'alarms':
                      keep = ('alarm' in text or 'clock' in text or 'mobiletimer' in text)
                  else:
                      keep = ('dnd' in text or 'focus' in text or 'sleep' in text)
                  if keep:
                      selected.append({'index': i, 'identifier': ident, 'parameters': params})
              out[kind] = {
                  'shortcut_id': sid,
                  'total_actions': len(actions),
                  'selected_actions': selected,
              }
              print(f'{kind}: {len(actions)} total, {len(selected)} selected')
              for x in selected:
                  print('\n---', kind, 'index', x['index'], x['identifier'], '---')
                  print(json.dumps(x['parameters'], ensure_ascii=False, indent=2, default=str))

          Path('harvested_donor_actions.json').write_text(
              json.dumps(out, ensure_ascii=False, indent=2, default=str), encoding='utf-8'
          )
          PY

      - name: Checkout Cherri v2.3.0
        uses: actions/checkout@v6
        with:
          repository: electrikmilk/cherri
          ref: v2.3.0
          path: cherri

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24.x'
          cache-dependency-path: cherri/go.sum

      - name: Add current HubSign headers to Cherri
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('cherri/signing.go')
          s = p.read_text()
          needle = 'request.Header.Set("User-Agent", fmt.Sprintf("cherri/%s", version))'
          replacement = needle + '\n\trequest.Header.Set("Origin", "https://routinehub.co")\n\trequest.Header.Set("Referer", "https://routinehub.co/")'
          if needle not in s:
              raise SystemExit('HubSign request header location not found')
          p.write_text(s.replace(needle, replacement, 1))
          PY

      - name: Compile Shortcut
        run: |
          set +e
          cd cherri
          go run . ../Escala_Alarme.cherri --debug
          STATUS=$?
          cd ..
          set -e
          echo "Cherri exit status: $STATUS"
          test -f "Escala Alarme.plist"
          test -f "Escala Alarme_unsigned.shortcut"

      - name: Sign with HubSign fallback
        run: |
          if [ -f "Escala Alarme.shortcut" ]; then
            python3 - <<'PY'
          from pathlib import Path
          p = Path('Escala Alarme.shortcut')
          if p.read_bytes()[:4] != b'AEA1':
              raise SystemExit('Existing signed file does not start with AEA1')
          print('Signed file already created by Cherri')
          PY
            exit 0
          fi

          python3 - <<'PY'
          import json
          import plistlib
          from pathlib import Path
          from urllib.request import Request, urlopen

          shortcut = plistlib.loads(Path('Escala Alarme.plist').read_bytes())
          xml = plistlib.dumps(shortcut, fmt=plistlib.FMT_XML).decode('utf-8')
          payload = json.dumps({'shortcutName': 'Escala Alarme', 'shortcut': xml}).encode('utf-8')
          req = Request(
              'https://hubsign.routinehub.services/sign',
              data=payload,
              headers={
                  'Content-Type': 'application/json',
                  'User-Agent': 'cherri/2.3.0',
                  'Origin': 'https://routinehub.co',
                  'Referer': 'https://routinehub.co/',
              },
              method='POST',
          )
          with urlopen(req, timeout=45) as response:
              signed = response.read()
          if signed[:4] != b'AEA1':
              raise SystemExit(f'Invalid signed response magic: {signed[:16]!r}')
          Path('Escala Alarme.shortcut').write_bytes(signed)
          print(f'Signed shortcut created: {len(signed)} bytes')
          PY

      - name: Validate signed Shortcut
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Escala Alarme.shortcut')
          data = p.read_bytes()
          assert data[:4] == b'AEA1', data[:16]
          print(f'OK: {p} starts with AEA1 and has {len(data)} bytes')
          PY

      - name: Upload generated Shortcut
        uses: actions/upload-artifact@v4
        with:
          name: escala-alarme-build
          if-no-files-found: error
          path: |
            Escala Alarme.shortcut
            Escala Alarme_unsigned.shortcut
            Escala Alarme.plist
            Escala_Alarme_processed.cherri
            Escala_Alarme.cherri
            harvested_donor_actions.json
            donor_alarms.shortcut
            donor_focus.shortcut
