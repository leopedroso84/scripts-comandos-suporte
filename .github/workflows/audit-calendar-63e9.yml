name: Audit Calendar Fix 63e9

on:
  push:
    branches:
      - chatgpt/escala-alarme-build-20260822
    paths:
      - '.github/workflows/audit-calendar-63e9.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect math expressions
        run: |
          python3 - <<'PY'
          import json, plistlib, time
          from urllib.request import Request, urlopen
          sid='63e919eda2a24e5fb55ed293b9ca6dbb'
          api=f'https://www.icloud.com/shortcuts/api/records/{sid}'
          rec=None
          for n in range(8):
              try:
                  with urlopen(Request(api,headers={'User-Agent':'Mozilla/5.0'}),timeout=30) as r:
                      rec=json.loads(r.read()); break
              except Exception as e:
                  print('retry',n+1,repr(e)); time.sleep(2)
          if rec is None: raise SystemExit('record unavailable')
          url=rec['fields']['shortcut']['value']['downloadURL']
          with urlopen(Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=45) as r:
              data=r.read()
          sc=plistlib.loads(data)
          actions=sc['WFWorkflowActions']
          print('ACTIONS',len(actions))
          print('FIRST_25')
          for i,a in enumerate(actions[:25]):
              print('ACTION',i,a.get('WFWorkflowActionIdentifier',''),json.dumps(a.get('WFWorkflowActionParameters',{}),ensure_ascii=False,default=str))
          print('MATH_ACTIONS')
          for i,a in enumerate(actions):
              ident=a.get('WFWorkflowActionIdentifier','')
              if ident in ('is.workflow.actions.calculateexpression','is.workflow.actions.math'):
                  print('ACTION',i,ident,json.dumps(a.get('WFWorkflowActionParameters',{}),ensure_ascii=False,default=str))
          PY
