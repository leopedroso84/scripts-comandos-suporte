name: Audit Calendar Fix 63e9

on:
  push:
    branches:
      - chatgpt/escala-alarme-build-20260822
    paths:
      - '.github/workflows/audit-calendar-63e9.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/audit-calendar-63e9.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect corrected V2
        run: |
          python3 - <<'PY'
          import json, plistlib, time
          from urllib.request import Request, urlopen
          from collections import Counter
          sid='63e919eda2a24e5fb55ed293b9ca6dbb'
          api=f'https://www.icloud.com/shortcuts/api/records/{sid}'
          rec=None
          for n in range(8):
              try:
                  with urlopen(Request(api,headers={'User-Agent':'Mozilla/5.0'}),timeout=30) as r:
                      rec=json.loads(r.read()); break
              except Exception as e:
                  print('retry',n+1,repr(e)); time.sleep(2)
          if rec is None: raise SystemExit('record unavailable')
          url=rec['fields']['shortcut']['value']['downloadURL']
          with urlopen(Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=45) as r:
              data=r.read()
          sc=plistlib.loads(data)
          actions=sc['WFWorkflowActions']
          c=Counter(a.get('WFWorkflowActionIdentifier','') for a in actions)
          print('CLIENT',sc.get('WFWorkflowClientVersion'))
          print('ACTIONS',len(actions))
          print('CALENDAR',c['is.workflow.actions.filter.calendarevents'])
          print('ALARMS',c['com.apple.mobiletimer-framework.MobileTimerIntents.MTToggleAlarmIntent'])
          print('FOCUS',c['is.workflow.actions.dnd.set'])
          print('SILENT',c['com.apple.ShortcutsActions.SetSilentModeAction'])
          print('VOLUME',c['is.workflow.actions.setvolume'])
          print('CALENDAR_ACTIONS')
          for i,a in enumerate(actions):
              if a.get('WFWorkflowActionIdentifier')=='is.workflow.actions.filter.calendarevents':
                  print('ACTION',i,json.dumps(a.get('WFWorkflowActionParameters',{}),ensure_ascii=False,default=str))
          print('DATE_ACTIONS')
          for i,a in enumerate(actions):
              if a.get('WFWorkflowActionIdentifier') in ('is.workflow.actions.date','is.workflow.actions.adjustdate','is.workflow.actions.format.date'):
                  print('ACTION',i,a.get('WFWorkflowActionIdentifier'),json.dumps(a.get('WFWorkflowActionParameters',{}),ensure_ascii=False,default=str))
          print('MODEL_SCAN')
          for i,a in enumerate(actions):
              ident=a.get('WFWorkflowActionIdentifier','')
              blob=json.dumps(a,ensure_ascii=False,default=str).lower()
              if 'model' in ident.lower() or 'chatgpt' in blob or 'appleintelligence' in blob or 'usemodel' in blob:
                  print('MODEL',i,ident)
          PY
