name: Audit Apple Intelligence Silent Mode Update

on:
  push:
    branches:
      - chatgpt/escala-alarme-build-20260822
    paths:
      - '.github/workflows/audit-icloud-silent-update.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/audit-icloud-silent-update.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect current alarm actions and popup parameters
        run: |
          python3 - <<'PY'
          import json, plistlib, time
          from urllib.request import Request, urlopen
          sid='512e1e6a3c404f6894c674410f0fed65'
          api=f'https://www.icloud.com/shortcuts/api/records/{sid}'
          rec=None
          for n in range(12):
              try:
                  with urlopen(Request(api,headers={'User-Agent':'Mozilla/5.0'}),timeout=30) as r:
                      rec=json.loads(r.read()); break
              except Exception as e:
                  print('retry',n+1,repr(e)); time.sleep(2)
          if rec is None: raise RuntimeError('record unavailable')
          urls=[]
          def walk(v):
              if isinstance(v,dict):
                  for k,x in v.items():
                      if k=='downloadURL' and isinstance(x,str): urls.append(x)
                      walk(x)
              elif isinstance(v,list):
                  for x in v: walk(x)
          walk(rec)
          obj=None
          for url in urls:
              with urlopen(Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=45) as r: data=r.read()
              try: candidate=plistlib.loads(data)
              except Exception: continue
              if isinstance(candidate,dict) and 'WFWorkflowActions' in candidate:
                  obj=candidate; break
          if obj is None: raise RuntimeError('no parseable payload')
          a=obj['WFWorkflowActions']
          print('ACTIONS',len(a))
          alarm_id='com.apple.mobiletimer-framework.MobileTimerIntents.MTToggleAlarmIntent'
          print('ALARM_ACTIONS_FULL')
          for i,x in enumerate(a):
              if x.get('WFWorkflowActionIdentifier')==alarm_id:
                  print('--- ALARM',i,'---')
                  print(json.dumps(x,ensure_ascii=False,default=str,sort_keys=True))
          print('UI_OR_DIALOG_RELATED_ACTIONS')
          for i,x in enumerate(a):
              ident=x.get('WFWorkflowActionIdentifier','')
              blob=json.dumps(x,ensure_ascii=False,default=str).lower()
              if any(k in ident.lower() for k in ['alert','result','notification','show','prompt','ask']) or any(k in blob for k in ['show when run','showwhenrun','show_result','showresult','dialog','confirmation']):
                  print(i,ident,json.dumps(x,ensure_ascii=False,default=str,sort_keys=True)[:4000])
          PY
