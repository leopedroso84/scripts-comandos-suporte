name: Audit Apple Intelligence Silent Mode Update

on:
  push:
    branches:
      - chatgpt/escala-alarme-build-20260822
    paths:
      - '.github/workflows/audit-icloud-silent-update.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect alarm popup source
        run: |
          python3 - <<'PY'
          import json, plistlib, time
          from urllib.request import Request, urlopen
          from collections import Counter
          sid='1d9848e8af904a029419e5235736f3a2'
          api=f'https://www.icloud.com/shortcuts/api/records/{sid}'
          rec=None
          for n in range(12):
              try:
                  with urlopen(Request(api,headers={'User-Agent':'Mozilla/5.0'}),timeout=30) as r:
                      rec=json.loads(r.read()); break
              except Exception as e:
                  print('retry',n+1,repr(e)); time.sleep(2)
          if rec is None: raise RuntimeError('record unavailable')
          urls=[]
          def walk(v):
              if isinstance(v,dict):
                  for k,x in v.items():
                      if k=='downloadURL' and isinstance(x,str): urls.append(x)
                      walk(x)
              elif isinstance(v,list):
                  for x in v: walk(x)
          walk(rec)
          obj=None
          for url in urls:
              with urlopen(Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=45) as r: data=r.read()
              try: candidate=plistlib.loads(data)
              except Exception: continue
              if isinstance(candidate,dict) and 'WFWorkflowActions' in candidate:
                  obj=candidate; break
          if obj is None: raise RuntimeError('no parseable payload')
          a=obj['WFWorkflowActions']
          c=Counter(x.get('WFWorkflowActionIdentifier','') for x in a)
          print('ACTIONS',len(a))
          print('UNIQUE_IDENTIFIERS')
          for ident,count in sorted(c.items()): print(count, ident)
          print('POSSIBLE_UI_ACTIONS')
          for i,x in enumerate(a):
              ident=x.get('WFWorkflowActionIdentifier','')
              low=ident.lower()
              blob=json.dumps(x,ensure_ascii=False,default=str).lower()
              if any(s in low for s in ['alert','result','notification','show','prompt','choose','ask']) or any(s in blob for s in ['mostrar ao executar','show when run','showresult','show alert']):
                  print('UI',i,ident,json.dumps(x.get('WFWorkflowActionParameters',{}),ensure_ascii=False,default=str)[:1600])
          print('ALARM_NEIGHBORHOODS')
          alarm_id='com.apple.mobiletimer-framework.MobileTimerIntents.MTToggleAlarmIntent'
          for i,x in enumerate(a):
              if x.get('WFWorkflowActionIdentifier')==alarm_id:
                  print('--- ALARM AT',i,'---')
                  for j in range(max(0,i-2),min(len(a),i+3)):
                      y=a[j]; print(j,y.get('WFWorkflowActionIdentifier'),json.dumps(y.get('WFWorkflowActionParameters',{}),ensure_ascii=False,default=str)[:1800])
          PY
