name: Audit Apple Intelligence Silent Mode Update

on:
  push:
    branches:
      - chatgpt/escala-alarme-build-20260822
    paths:
      - '.github/workflows/audit-icloud-silent-update.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/audit-icloud-silent-update.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect new V2 silent update
        run: |
          python3 - <<'PY'
          import json, plistlib, time
          from urllib.request import Request, urlopen
          sid='c9baeee2ae8e49829702dec31f4c5346'
          api=f'https://www.icloud.com/shortcuts/api/records/{sid}'
          rec=None
          for n in range(12):
              try:
                  with urlopen(Request(api,headers={'User-Agent':'Mozilla/5.0'}),timeout=30) as r:
                      rec=json.loads(r.read()); break
              except Exception as e:
                  print('retry',n+1,repr(e)); time.sleep(2)
          if rec is None: raise RuntimeError('record unavailable')
          urls=[]
          def walk(v):
              if isinstance(v,dict):
                  for k,x in v.items():
                      if k=='downloadURL' and isinstance(x,str): urls.append(x)
                      walk(x)
              elif isinstance(v,list):
                  for x in v: walk(x)
          walk(rec)
          obj=None
          for url in urls:
              with urlopen(Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=45) as r: data=r.read()
              try: cand=plistlib.loads(data)
              except Exception: continue
              if isinstance(cand,dict) and 'WFWorkflowActions' in cand: obj=cand; break
          if obj is None: raise RuntimeError('no parseable payload')
          a=obj['WFWorkflowActions']
          print('ACTIONS',len(a))
          print('TAIL_FROM_145')
          for i in range(145,len(a)):
              x=a[i]
              print('ACTION',i,x.get('WFWorkflowActionIdentifier',''),json.dumps(x.get('WFWorkflowActionParameters',{}),ensure_ascii=False,default=str)[:6000])
          PY
